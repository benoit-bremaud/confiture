# Script "yuki_speak": speak a reply of the Pi 5 satellite on the Nest Mini (#18, ADR-0008).
# Called by nest-relay (deploy/pi5) with the reply text, because an Assist pipeline returns its
# audio to the satellite only. UI paste format (Settings > Scripts > YAML) as script.yuki_speak;
# replace the <placeholders> with the real entity ids.
alias: Yuki speak
mode: queued
max: 3
max_exceeded: warning
fields:
  text:
    description: Reply to speak, in French.
    required: true
    selector:
      text:
sequence:
  - action: tts.speak
    target:
      entity_id: <piper-tts-entity>
    data:
      media_player_entity_id: <nest-mini-media-player>
      # Piper names languages with a region: fr_FR, not fr.
      language: fr_FR
      message: "{{ text }}"
