# Local SonarQube scan (self-hosted, global analysis token from the environment, never here).
sonar.projectKey=confiture
sonar.projectName=confiture
sonar.sources=.
sonar.exclusions=**/*.local.md,.claude/**,**/tests/**
sonar.qualitygate.wait=true
sonar.tests=pi3cam/tests,sttbench/tests,deploy/pi5/nest-relay/tests
sonar.test.inclusions=**/tests/**
sonar.python.coverage.reportPaths=pi3cam/coverage.xml,sttbench/coverage.xml,deploy/pi5/nest-relay/coverage.xml
sonar.coverage.exclusions=pi3cam/main.py,sttbench/bench.py,deploy/pi5/nest-relay/main.py
