# Local SonarQube scan (self-hosted, global analysis token from the environment, never here).
sonar.projectKey=confiture
sonar.projectName=confiture
sonar.sources=.
sonar.exclusions=**/*.local.md,.claude/**,pi3cam/tests/**
sonar.qualitygate.wait=true
sonar.tests=pi3cam/tests
sonar.test.inclusions=pi3cam/tests/**
sonar.python.coverage.reportPaths=pi3cam/coverage.xml
sonar.coverage.exclusions=pi3cam/main.py
