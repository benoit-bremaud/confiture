# Default gitleaks rules plus the project's personal-data rules (CLAUDE.md).
[extend]
useDefault = true

[[rules]]
id = "mac-address"
description = "MAC address (home network inventory stays in inventory.local.md)"
# Colon or dash separators (router UIs and Windows use dashes).
regex = '''(?i)\b[0-9a-f]{2}(?:[:-][0-9a-f]{2}){5}\b'''

[[rules]]
id = "private-lan-ip"
description = "Private IPv4 address (RFC 1918: 10/8, 172.16/12, 192.168/16)"
regex = '''\b(?:10\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])|192\.168)\.\d{1,3}\.\d{1,3}\b'''

[[rules]]
id = "tailscale-ip"
description = "Tailscale CGNAT address (100.64.0.0/10)"
regex = '''\b100\.(?:6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.\d{1,3}\.\d{1,3}\b'''
